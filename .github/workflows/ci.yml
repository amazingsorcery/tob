name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run irrelevant. Cancel it rather than
# paying for it and waiting behind it. Keyed on the ref, so pushes to different branches do
# not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Nothing here writes to the repository, opens a PR, or pushes a package.
permissions:
  contents: read

env:
  # Silences the "Corepack is about to download..." prompt, which otherwise hangs a
  # non-interactive runner until the step times out.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  NEXT_TELEMETRY_DISABLED: "1"

# ACTION PINNING: these are pinned to major-version tags, which GitHub moves as patches
# land. That is common practice and it is not the strongest option — a tag can be
# repointed. To pin to immutable commit SHAs instead, resolve each one:
#
#   gh api repos/actions/checkout/git/refs/tags/v4 --jq .object.sha
#
# and rewrite as `actions/checkout@<sha> # v4`. Real SHAs are deliberately not guessed here.

jobs:
  # =====================================================================================
  # Everything that needs the application.
  #
  # NO SERVICE CONTAINERS. There is no database, no cache and no mail sink: the site is 39
  # pages generated at build time from the Markdown in content/works/, and the application
  # reads no environment variable at all. A `postgres` service here would be a dependency
  # that nothing opens, which is the same defect as a production container with no consumer.
  #
  # Deliberately ONE job rather than five. Each extra job repeats the checkout, the install
  # and the build — roughly two minutes of pure duplication each — and buys nothing, because
  # these steps are strictly ordered anyway. They fail fast in order, so a lint error stops
  # the run before the browser download.
  # =====================================================================================
  verify:
    name: typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # pnpm must exist before setup-node, because setup-node's `cache: pnpm` shells out to
      # `pnpm store path` to find the directory it is caching. Reversing these two steps
      # produces a confusing "Unable to locate executable file: pnpm".
      # No `version:` is given: action-setup v4 reads the packageManager field in
      # package.json, so CI cannot drift from the lockfile's producer.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Keyed on pnpm-lock.yaml. A lockfile change is the only thing that should
          # invalidate the dependency cache.
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile fails rather than silently resolving a different tree when
        # package.json and pnpm-lock.yaml disagree. That disagreement is a real bug and CI
        # is where it should surface.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # WITH COVERAGE, because vitest.config.ts carries a coverage floor for lib/works.ts —
      # the Markdown parser, which is the one piece of real logic on this site and the one
      # whose regression breaks navigation for a whole dissertation. A threshold that only
      # runs on a developer's machine is not a floor.
      - name: Unit tests, with coverage thresholds
        run: pnpm test:coverage

      # A dependency gate. It was added after an audit found 3 critical and 7 high
      # advisories sitting unnoticed in the tree. Fails on high and critical only; a
      # moderate advisory in a dev-server package cannot be reached by anything this
      # deployment ships.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      # `pnpm build` is `tsx scripts/copy-katex-assets.ts && next build`. public/katex/ is
      # generated and gitignored, so on a clean checkout — which is exactly what this runner
      # is — the first half is what stops the build shipping a site whose equations render
      # as unpositioned glyphs.
      - name: Build
        run: pnpm build

      # The generated stylesheet is the one build output whose absence is silent: every
      # page still renders, and only the mathematics is wrong. Cheaper to assert here than
      # to notice it in production.
      - name: Assert the KaTeX assets were generated
        run: test -f public/katex/katex.min.css && test -d public/katex/fonts

      # Chromium only. Installing all three engines costs several minutes and a few hundred
      # megabytes per run. --with-deps pulls the shared libraries Chromium needs on a bare
      # runner.
      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts starts the server itself with `pnpm build && pnpm start` and
      # waits for a 200 on `/` — the same probe infra/deploy.sh uses, because a static site
      # has no health endpoint. The second build reuses the .next cache from the step above
      # and takes seconds.
      #
      # This step FAILS if tests/e2e holds no spec. That is intentional: an e2e step that
      # passes while running zero tests is worse than one that is red.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        # `always()` so the report survives a failing run — the only run where anyone wants
        # it.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # =====================================================================================
  # Prove the Dockerfile still builds.
  #
  # Not redundant with the job above. It exercises what `pnpm build` on a runner never
  # touches: the pnpm install inside a Linux container, layer ordering, the standalone
  # output guard, the generated KaTeX assets, and the file layout of the final image.
  # Without it, a broken Dockerfile is found on the VPS at deploy time, which is the worst
  # possible moment. Runs in parallel — no `needs:` — so a Dockerfile regression is
  # reported even when a test is failing.
  #
  # ONE target. The `migrator` target went with the database.
  # =====================================================================================
  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          # Nothing is pushed: there is no registry in this deployment. The VPS builds from
          # source in deploy.sh. This job only has to answer "does it build".
          push: false
          load: false
          tags: app-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================================================================
  # Static validation of the infrastructure files themselves.
  # Cheap (well under a minute) and it catches the class of error that is otherwise only
  # found by running the thing on the server at 2 a.m.
  # =====================================================================================
  infra:
    name: shell + compose + caddy validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Lint the shell scripts
        # ubuntu-latest ships shellcheck. -S warning: style suggestions are noise; genuine
        # quoting and portability bugs are not.
        run: shellcheck -S warning infra/*.sh

      - name: Validate both compose files
        # `compose config` performs the full ${...} substitution, so it needs a .env. The
        # example file is used with its placeholder values: what is being validated is the
        # FILE's structure, and deploy.sh separately refuses to run while those placeholders
        # are in place.
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.yml config --quiet
          rm -f .env

      - name: Assert the production topology
        # `compose config` proves the file PARSES. These assertions prove it says what it is
        # meant to say, which is the question that matters. Each corresponds to a failure
        # that stays invisible until it is exploited or until the site is already down:
        #
        #   1. Exactly two services. A service added or dropped by a bad merge is a change
        #      to the attack surface and nothing else here would notice.
        #   2. ONLY caddy publishes ports. A stray `ports:` on web puts the Node server on
        #      the VPS's public IP with none of the security headers — and UFW does not save
        #      you, because Docker writes its own iptables rules ahead of UFW's chain.
        #   3. web is on the internal network ONLY, and that network really is internal.
        #      That is what makes "the application container cannot reach the internet" a
        #      property of the topology rather than a promise about the code.
        #   4. web has no env_file. The application reads no environment variable; a file of
        #      values injected into it is either dead weight or a secret in a place that has
        #      no secrets.
        #   5. Every depends_on names a service that exists. A leftover `depends_on: db`
        #      makes every `up` fail, on the server, at the end of a deploy.
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml config --format json > /tmp/compose.json
          rm -f .env

          echo "Services:"; jq -r '.services | keys | .[]' /tmp/compose.json

          jq -e '([.services | keys[]] | sort) == ["caddy","web"]' /tmp/compose.json > /dev/null \
            || { echo "FAIL: expected exactly caddy and web"; exit 1; }
          echo "OK: two services, exactly as expected"

          published=$(jq -r '[.services | to_entries[] | select((.value.ports // []) | length > 0) | .key] | sort | join(",")' /tmp/compose.json)
          if [ "$published" != "caddy" ]; then
            echo "FAIL: only caddy may publish ports; these do: $published"
            exit 1
          fi
          echo "OK: caddy is the only service publishing ports"

          jq -e '(.services.web.networks | keys) == ["site"]' /tmp/compose.json > /dev/null \
            || { echo "FAIL: web must be on the 'site' network and nothing else"; exit 1; }
          jq -e '.networks.site.internal == true' /tmp/compose.json > /dev/null \
            || { echo "FAIL: the 'site' network must be internal: true"; exit 1; }
          echo "OK: web is on an internal network with no route to the internet"

          jq -e '(.services.web.env_file // []) | length == 0' /tmp/compose.json > /dev/null \
            || { echo "FAIL: web must not read an env_file — the application reads no environment"; exit 1; }
          echo "OK: web reads no environment file"

          jq -e '
            (.services | keys) as $defined
            | [.services | to_entries[]
               | ((.value.depends_on // {}) | keys[])
               | select(. as $d | $defined | index($d) | not)]
              | length == 0
          ' /tmp/compose.json > /dev/null \
            || { echo "FAIL: a service depends_on something that is not defined in this file"; exit 1; }
          echo "OK: every depends_on names a service that exists"

      - name: Assert the Caddyfile is self-contained and the CSP has no remote origin
        # Two properties, both start-blocking or silently-weakening if they break.
        #
        #   1. NO `import`. The Caddyfile used to import a generated csp.caddy, which had to
        #      be mounted alongside it; the day the mount was missing, Caddy failed to load
        #      its configuration and served nothing at all. That file is gone and the policy
        #      is written inline. A reintroduced import is a start-blocking defect.
        #   2. NO REMOTE ORIGIN IN THE CSP. This site fetches nothing from anywhere: no
        #      fonts CDN, no tiles, no analytics, no camera. Any `https://` inside the
        #      policy means something crept in, and a policy that lists a third party is a
        #      third party that learns which pages a reader opened.
        run: |
          if grep -nE '^[[:space:]]*import[[:space:]]' infra/Caddyfile; then
            echo "FAIL: the Caddyfile imports a file that must then be mounted into the container."
            exit 1
          fi
          echo "OK: the Caddyfile is self-contained"

          csp=$(grep -E '^[[:space:]]*Content-Security-Policy[[:space:]]' infra/Caddyfile)
          if [ -z "$csp" ]; then
            echo "FAIL: no Content-Security-Policy header found in infra/Caddyfile"
            exit 1
          fi
          if printf '%s' "$csp" | grep -q '://'; then
            echo "FAIL: the CSP names a remote origin:"
            printf '%s\n' "$csp"
            exit 1
          fi
          echo "OK: the CSP is same-origin only"

      - name: Validate the Caddyfile
        # `caddy validate` parses the config and builds the full provisioning graph, so it
        # catches a misspelled directive, a bad matcher and an unbalanced brace. DOMAIN and
        # ACME_EMAIL are supplied because the file reads them as {$VAR} at load time; the
        # values are irrelevant to whether the syntax is correct.
        run: |
          docker run --rm \
            -e DOMAIN=ci.example.invalid \
            -e ACME_EMAIL=ci@example.invalid \
            -e ACME_CA=https://acme-staging-v02.api.letsencrypt.org/directory \
            -v "${{ github.workspace }}/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
