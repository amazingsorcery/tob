name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Otherwise Corepack's download prompt hangs the runner.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  NEXT_TELEMETRY_DISABLED: "1"

# Actions are pinned to major tags. For immutable SHAs, resolve with e.g.
#   gh api repos/actions/checkout/git/refs/tags/v4 --jq .object.sha
# and write `actions/checkout@<sha> # v4`.

jobs:
  # One sequential job so checkout/install/build aren't repeated; fails fast in order.
  # No service containers are needed.
  verify:
    name: typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Before setup-node, whose `cache: pnpm` needs the pnpm binary. Version comes from
      # package.json's packageManager field.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Coverage enforces the lib/works.ts floor in vitest.config.ts.
      - name: Unit tests, with coverage thresholds
        run: pnpm test:coverage

      # High and critical only.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      # Also generates the gitignored public/katex/ (scripts/copy-katex-assets.ts).
      - name: Build
        run: pnpm build

      # A missing KaTeX stylesheet doesn't break pages, only maths, so assert it.
      - name: Assert the KaTeX assets were generated
        run: test -f public/katex/katex.min.css && test -d public/katex/fonts

      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts builds and starts the server itself (reusing the .next cache).
      # Fails if tests/e2e has no specs.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Check the Dockerfile builds (container install, standalone guard, KaTeX assets).
  # Runs in parallel with `verify`.
  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          # No registry; the VPS builds from source.
          push: false
          load: false
          tags: app-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Static validation of the infra files.
  infra:
    name: shell + compose + caddy validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Lint the shell scripts
        run: shellcheck -S warning infra/*.sh

      - name: Validate both compose files
        # Interpolation needs a .env; the example's placeholders are fine for validation.
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.yml config --quiet
          rm -f .env

      - name: Assert the production topology
        # Checks: exactly caddy and web; only caddy publishes ports (Docker bypasses UFW);
        # web is only on the internal `site` network; web has no env_file; every
        # depends_on target exists.
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml config --format json > /tmp/compose.json
          rm -f .env

          echo "Services:"; jq -r '.services | keys | .[]' /tmp/compose.json

          jq -e '([.services | keys[]] | sort) == ["caddy","web"]' /tmp/compose.json > /dev/null \
            || { echo "FAIL: expected exactly caddy and web"; exit 1; }
          echo "OK: two services, exactly as expected"

          published=$(jq -r '[.services | to_entries[] | select((.value.ports // []) | length > 0) | .key] | sort | join(",")' /tmp/compose.json)
          if [ "$published" != "caddy" ]; then
            echo "FAIL: only caddy may publish ports; these do: $published"
            exit 1
          fi
          echo "OK: caddy is the only service publishing ports"

          jq -e '(.services.web.networks | keys) == ["site"]' /tmp/compose.json > /dev/null \
            || { echo "FAIL: web must be on the 'site' network and nothing else"; exit 1; }
          jq -e '.networks.site.internal == true' /tmp/compose.json > /dev/null \
            || { echo "FAIL: the 'site' network must be internal: true"; exit 1; }
          echo "OK: web is on an internal network with no route to the internet"

          jq -e '(.services.web.env_file // []) | length == 0' /tmp/compose.json > /dev/null \
            || { echo "FAIL: web must not read an env_file — the application reads no environment"; exit 1; }
          echo "OK: web reads no environment file"

          jq -e '
            (.services | keys) as $defined
            | [.services | to_entries[]
               | ((.value.depends_on // {}) | keys[])
               | select(. as $d | $defined | index($d) | not)]
              | length == 0
          ' /tmp/compose.json > /dev/null \
            || { echo "FAIL: a service depends_on something that is not defined in this file"; exit 1; }
          echo "OK: every depends_on names a service that exists"

      - name: Assert the Caddyfile is self-contained and the CSP has no remote origin
        # No `import` (only the Caddyfile is mounted), and no remote origins in the CSP.
        run: |
          if grep -nE '^[[:space:]]*import[[:space:]]' infra/Caddyfile; then
            echo "FAIL: the Caddyfile imports a file that must then be mounted into the container."
            exit 1
          fi
          echo "OK: the Caddyfile is self-contained"

          csp=$(grep -E '^[[:space:]]*Content-Security-Policy[[:space:]]' infra/Caddyfile)
          if [ -z "$csp" ]; then
            echo "FAIL: no Content-Security-Policy header found in infra/Caddyfile"
            exit 1
          fi
          if printf '%s' "$csp" | grep -q '://'; then
            echo "FAIL: the CSP names a remote origin:"
            printf '%s\n' "$csp"
            exit 1
          fi
          echo "OK: the CSP is same-origin only"

      - name: Validate the Caddyfile
        # Dummy DOMAIN/ACME_EMAIL values; only the config structure is being checked.
        run: |
          docker run --rm \
            -e DOMAIN=ci.example.invalid \
            -e ACME_EMAIL=ci@example.invalid \
            -e ACME_CA=https://acme-staging-v02.api.letsencrypt.org/directory \
            -v "${{ github.workspace }}/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
