# Local smoke test of the production image (development just uses `pnpm dev`).
#
#   docker compose up -d --build          # build and run the runner image
#   curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3000/     # expect 200
#   curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3000/katex/katex.min.css
#   docker compose down
#
# No Caddy locally (no domain for a certificate); CI runs `caddy validate` on the Caddyfile.

name: ${COMPOSE_PROJECT_NAME:-app}-local

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ${IMAGE_NAME:-app-web}:local
    restart: "no"
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Loopback only, not the whole network.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
