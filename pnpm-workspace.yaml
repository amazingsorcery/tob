# Dependencies allowed to run install scripts. pnpm 11 fails non-interactive installs
# (ERR_PNPM_IGNORED_BUILDS) if any are unresolved. Both fetch native binaries; build-time only.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# Next bundles postcss@8.4.31, which has two high advisories; force the patched 8.x.
overrides:
  postcss: ^8.5.26
