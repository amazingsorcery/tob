# Production stack for a single Ubuntu LTS VPS.
#
#   caddy -> TLS, security headers/CSP, reverse proxy to web:3000. Only published ports.
#   web   -> Next.js standalone server for the prerendered pages. Not published.
#
# Normally run via infra/deploy.sh (health gate + rollback), or directly:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# `${VAR}` is interpolated by compose from the shell and the adjacent `.env`;
# `${VAR:?msg}` refuses to start if unset. `web` reads no environment, so it has no env_file.

name: ${COMPOSE_PROJECT_NAME:-app}

# ---------------------------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------------------------

# Log rotation for every service; the json-file default is unbounded. 60 MB worst case.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &default-hardening
  security_opt:
    - no-new-privileges:true

services:
  # -------------------------------------------------------------------------------------
  # web
  # -------------------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ${IMAGE_NAME:-app-web}:${IMAGE_TAG:-current}
    restart: unless-stopped
    logging: *default-logging
    <<: *default-hardening
    cap_drop:
      - ALL

    # docker-init as PID 1 for signal handling and zombie reaping.
    init: true

    # Not `ports:`: publishing would bypass Caddy, and Docker's iptables rules bypass UFW.
    expose:
      - "3000"

    # Mirrors the Dockerfile HEALTHCHECK so it can be tuned without a rebuild.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # ~4x a local `next start` baseline; not yet measured on the VPS. If `docker stats`
    # shows it near the limit, investigate before raising it.
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 2.0

    networks:
      # Internal network only: no outbound access at run time. Builds use the daemon's network.
      - site

  # -------------------------------------------------------------------------------------
  # caddy
  # -------------------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    <<: *default-hardening
    cap_drop:
      - ALL
    cap_add:
      # Bind 80/443 inside the container.
      - NET_BIND_SERVICE

    ports:
      - "80:80" # ACME HTTP-01 challenge + the redirect to HTTPS
      - "443:443" # TLS
      - "443:443/udp" # HTTP/3

    environment:
      # Read by the Caddyfile as {$DOMAIN} / {$ACME_EMAIL}.
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in .env}
      # Use the staging directory while testing DNS/firewall changes (production rate-limits
      # failed authorisations).
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      TZ: ${TZ:-UTC}

    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account key; must persist or redeploys hit rate limits.
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      # Not service_healthy: Caddy should still come up (ACME, 502s) if web is broken.
      - web

    # Generous on purpose; an OOM-killed proxy takes the site offline.
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 1.0

    networks:
      - edge # the internet, in and out (published ports + ACME)
      - site # to reach web:3000

volumes:
  # The only state on the box. Don't use `docker compose down -v`.
  caddy_data:
  caddy_config:

# `site` is internal (no gateway), so `web` has no internet access. `caddy` joins both and
# uses `edge` for published ports and ACME.
networks:
  edge:
    driver: bridge

  site:
    driver: bridge
    internal: true
